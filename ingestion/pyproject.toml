# ingestion/pyproject.toml
[project]
name = "req2ado-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "openpyxl>=3.1.5",
    "markdown-it-py>=3.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "reportlab>=4.2.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
