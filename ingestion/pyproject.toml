# ingestion/pyproject.toml
[project]
name = "req2ado-ingestion"
version = "0.3.5"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "striprtf>=0.0.28",
    "markdown-it-py>=3.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    # Pinned to match the Chroma server image tag (deploy/helm/req2ado/
    # values.yaml image.chroma.tag) -- a newer client against the 0.6.3
    # server fails get_or_create_collection with KeyError('_type'). Bump
    # both together.
    "chromadb==0.6.3",
    # Already present transitively via chromadb; declared directly now that
    # app/leveling/conflict_detection.py imports it for a vectorized
    # cosine-similarity matrix (replacing an O(n^2) pure-Python loop).
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "json-repair>=0.30.0",
    # Pinned to the 1.43.0/0.64b0 line -- chromadb pins
    # opentelemetry-exporter-otlp-proto-grpc==1.43.0 transitively; a newer
    # line (1.44.0/0.65b0) conflicts with that pin.
    "opentelemetry-distro==0.64b0",
    "opentelemetry-instrumentation-fastapi==0.64b0",
    "opentelemetry-instrumentation-httpx==0.64b0",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "reportlab>=4.2.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.23.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Without this, setuptools only packages .py files by default -- app/prompts/
# *.txt (S7's extracted prompt templates) would silently be EXCLUDED from
# the wheel `pip install .` builds (Dockerfile:14), even though `COPY app
# ./app` (Dockerfile:13) puts them in the build context. load_prompt()
# resolves paths relative to the INSTALLED package location at runtime, not
# the build context, so a container built without this would crash on the
# first SURVEY job with FileNotFoundError -- confirmed by reading the
# Dockerfile, not yet reproduced in a real container build.
[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
