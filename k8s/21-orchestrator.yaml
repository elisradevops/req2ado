apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: req2ado
spec:
  selector:
    app: orchestrator
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: req2ado
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: req2ado-orchestrator:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: req2ado-config
            - secretRef:
                name: req2ado-secrets
          env:
            - name: PORT
              value: "3001"
          # /health = liveness (process up, no dependency check -- a
          # liveness failure restarts the pod, wrong response to "a
          # dependency blipped"). /ready = readiness (real Postgres+Redis
          # checks -- a readiness failure removes the pod from the Service
          # endpoint list without restarting it). See
          # docs/handoff-point7-*.md for why these are split.
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          # Graceful shutdown (app.enableShutdownHooks() + OnModuleDestroy
          # hooks closing the BullMQ Queue / health-check Redis client, see
          # docs/handoff-point7-*.md) needs a terminationGracePeriod long
          # enough for an in-flight confirm() write to finish -- default 30s
          # is usually enough for a single-node-tree write; raise this if
          # your real documents produce large trees.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 30
