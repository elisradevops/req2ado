apiVersion: v1
kind: Service
metadata:
  name: mcp-ado-server
  namespace: req2ado
spec:
  selector:
    app: mcp-ado-server
  ports:
    - port: 4100
      targetPort: 4100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ado-server
  namespace: req2ado
spec:
  # NOTE (updated -- the claim below was stale): pipeline.worker.ts
  # resolves the submitting user's vaulted PAT once per job
  # (job.userId ? adoCredentialResolver.resolve(job.userId) : undefined)
  # and threads it through every one of its own ADO calls
  # (discoverLinkTypes/discoverFields/getWorkItemsBatch/queryIds) -- these
  # do NOT 401 against a real ADO backend for any job with a resolved
  # userId, which every job submitted through the current auth flow has.
  # The remaining real gap is narrow: a job predating the userId column
  # (userId === null, historical rows only) resolves no credential and its
  # background ADO reads will 401 against ADO_BACKEND=real -- same
  # degraded-but-expected behavior those rows already have for KB
  # grounding (see Job.userId's own schema.prisma doc comment). confirm()'s
  # synchronous, request-scoped calls are unaffected either way.
  replicas: 2
  selector:
    matchLabels:
      app: mcp-ado-server
  template:
    metadata:
      labels:
        app: mcp-ado-server
    spec:
      containers:
        - name: mcp-ado-server
          image: req2ado-mcp-ado-server:latest
          ports:
            - containerPort: 4100
          envFrom:
            - configMapRef:
                name: req2ado-config
            - secretRef:
                name: req2ado-secrets
          env:
            - name: PORT
              value: "4100"
            # Only needed against a self-signed on-prem cert -- points at
            # the file mounted below. Omit this env var (and the volume/
            # volumeMount) entirely for a CA-issued cert.
            - name: ADO_CA_CERT
              value: "/etc/req2ado/ca/ca-bundle.pem"
          volumeMounts:
            - name: ado-ca-cert
              mountPath: /etc/req2ado/ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: ado-ca-cert
          secret:
            secretName: req2ado-secrets
            items:
              - key: ADO_CA_CERT_PEM
                path: ca-bundle.pem
      terminationGracePeriodSeconds: 30
