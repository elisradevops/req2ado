apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: req2ado
spec:
  clusterIP: None # headless -- StatefulSet gets a stable per-pod DNS name
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: req2ado
spec:
  serviceName: postgres
  replicas: 1 # single-instance -- no HA/replication set up here
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "req2ado"
            - name: POSTGRES_DB
              value: "req2ado"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: req2ado-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "req2ado"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "req2ado"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName set -- uses the cluster's default. Set one
        # explicitly to match your cluster before using this beyond
        # dev/staging.
        resources:
          requests:
            storage: 5Gi
