apiVersion: v1
kind: ConfigMap
metadata:
  name: req2ado-config
  namespace: req2ado
data:
  # --- LLM (Open WebUI or Ollama's OpenAI-compatible endpoint) ---
  # LLM_BASE_URL shape depends on the actual backend and, for Open WebUI,
  # whether its Ollama integration is enabled -- there is no single correct
  # value:
  #   - Raw Ollama (this example):        http://<host>:11434/v1
  #   - Open WebUI, Ollama integration ON:  http://<host>:3000/ollama/v1
  #   - Open WebUI, Ollama integration OFF: http://<host>:3000/api/v1
  # Confirmed live against a real production Open WebUI instance: with the
  # Ollama integration disabled at the platform level, the /ollama/v1 shape
  # silently returns an empty model list and every chat call fails, while
  # /api/v1 (Open WebUI's own first-class OpenAI-compatible REST namespace)
  # works reliably. If pointing at Open WebUI, confirm which shape applies
  # before deploying -- see openwebui.client.ts's openWebUiAppRoot() comment.
  LLM_BASE_URL: "http://ollama.req2ado.svc.cluster.local:11434/v1"
  # NOT a per-user credential -- every user configures their own Open WebUI
  # token + default chat/vision model in Settings (vaulted server-side).
  # This is a fallback-of-last-resort model name only, used when a job's
  # per-user default can't be resolved, plus the baseline EtaService prices
  # an estimate against.
  LLM_CHAT_MODEL: "llama3.1"
  EMBED_TRANSPORT: "ollama"
  EMBED_MODEL: "nomic-embed-text"
  EMBED_PATH: "/api/embed"
  LLM_TRUSTED_LOCAL: "false"

  # --- ADO (on-prem TFS/ADO Server) ---
  # ADO_BASE_URL/ADO_PROJECT/ADO_AREA_PATH removed -- both are now genuinely
  # per-user/per-job: org URL + PAT come from login (vaulted server-side),
  # and the target project is an explicit Job.adoProject column threaded
  # through every ADO operation instead of a server-wide default.
  # Initial System.State written on every created work item -- defaults to
  # "Proposed"; override if the target process template's initial state
  # has a different name.
  ADO_INITIAL_STATE: "Proposed"

  # --- Our MCP server (ADO write/read tools) ---
  MCP_URL: "http://mcp-ado-server.req2ado.svc.cluster.local:4100"
  ADO_BACKEND: "real"

  # --- Pipeline worker ---
  PIPELINE_WORKER_CONCURRENCY: "4"

  # --- Batch/folder ingestion (NEW-05) ---
  BATCH_SURVEY_CONCURRENCY: "2"
  BATCH_PUMP_INTERVAL_MS: "10000"
  MAX_BATCH_FILES: "25"
  BATCH_SUBMIT_STUCK_MS: "300000"

  # --- Infra (in-cluster service DNS names) ---
  # REDIS_URL has no credential in this topology (matches docker-compose's
  # unauthenticated dev redis) -- safe as a plain ConfigMap value. DATABASE_URL
  # embeds the Postgres password, so it lives in 02-secret.yaml instead, not
  # here.
  REDIS_URL: "redis://redis.req2ado.svc.cluster.local:6379"
  INGESTION_BASE_URL: "http://ingestion.req2ado.svc.cluster.local:8000"

  # --- Ingestion's Chroma dedup vector store ---
  # "http" here (not the default "embedded") -- required for ingestion to
  # be safely scaled beyond replicas: 1 (see docs/handoff-point7-*.md).
  CHROMA_MODE: "http"
  CHROMA_HOST: "chroma.req2ado.svc.cluster.local"
  CHROMA_PORT: "8000"
