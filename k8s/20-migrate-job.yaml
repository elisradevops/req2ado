# One-shot migration step -- mirrors docker-compose.yml's `migrate` service
# / the initContainer pattern orchestrator/Dockerfile's own CMD comment
# describes. Re-apply (delete + apply) this Job on every orchestrator image
# update that includes new migrations; it does not run automatically as
# part of a rolling deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: req2ado-migrate
  namespace: req2ado
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Targets the multi-stage Dockerfile's `builder` stage, NOT the
          # default `runtime` stage -- the `prisma` CLI package is a
          # devDependency, stripped from `runtime` (see orchestrator/Dockerfile).
          # Published by orchestrator-release.yml's second build step, same
          # floating-tag convention as this directory's other manifests
          # (nothing here rewrites k8s/ automatically, so a version-pinned-only
          # tag would silently rot). Pin to `:<version>-builder` (also
          # published) instead if you want a real deployment pinned to a
          # specific release.
          image: elisradevops/req2ado-orchestrator:latest-builder
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: req2ado-secrets
                  key: DATABASE_URL
