# The one stateful thing ingestion depends on, now that dedup vector
# storage is externalized (CHROMA_MODE=http, see 01-configmap.yaml and
# docs/handoff-point7-*.md) -- ingestion itself is stateless/scalable ×N
# as a result.
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: req2ado
spec:
  clusterIP: None # headless -- StatefulSet gets a stable per-pod DNS name
  selector:
    app: chroma
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: req2ado
spec:
  serviceName: chroma
  replicas: 1 # single-instance -- Chroma itself has no built-in clustering
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
