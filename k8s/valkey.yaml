apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: req2ado
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: req2ado
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: elisradevops/req2ado-valkey:1.0.1
          ports:
            - containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: req2ado-valkey
                  key: valkey-password
          command: ['valkey-server', '--requirepass', '$(VALKEY_PASSWORD)']
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
