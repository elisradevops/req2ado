apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: req2ado
spec:
  selector:
    app: ingestion
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: req2ado
spec:
  # Safe to scale beyond 1 ONLY because 01-configmap.yaml sets
  # CHROMA_MODE=http (a real, shared Chroma server, see 12-chroma.yaml) --
  # the default CHROMA_MODE=embedded (local PersistentClient) is
  # single-instance-only. See docs/handoff-point7-*.md.
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: req2ado-ingestion:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: req2ado-config
            - secretRef:
                name: req2ado-secrets
          env:
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
      terminationGracePeriodSeconds: 30
