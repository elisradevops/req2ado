# Shared log-rotation stanza -- no rotation/retention was configured
# anywhere before this, so Docker's json-file default (unbounded) applied to
# every service. Applied only to the three services with meaningful
# application logs (ingestion, orchestrator, pipeline-worker); infra
# containers (postgres/redis/chroma/mcp-ado-server) are left on the default.
x-app-logging: &app-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: req2ado
      POSTGRES_PASSWORD: req2ado
      POSTGRES_DB: req2ado
    ports:
      - "5432:5432"
    volumes:
      - req2ado_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Disables RDB snapshotting (default: BGSAVE on "100 changes in 300s").
    # This Redis instance is purely a BullMQ job queue + pub/sub broker --
    # nothing here needs to survive a restart, and losing in-flight jobs on
    # a Redis restart is an accepted dev-environment risk already. Observed
    # live: periodic BGSAVE's fork() call caused a Redis latency spike that
    # made BullMQ's lock-renewal command fail mid-job ("could not renew
    # lock"), stalling and force-reprocessing an otherwise-healthy
    # long-running SURVEY job. `--appendonly no` is already the image
    # default; stated explicitly so nothing re-enables durability later
    # without a deliberate decision.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  # Real, shared Chroma server -- ingestion connects to this via
  # chromadb.HttpClient (CHROMA_MODE=http below) instead of each replica
  # holding its own independent local PersistentClient. Makes ingestion
  # genuinely stateless/horizontally-scalable; this container is the
  # single stateful thing (backed by the req2ado_chroma volume).
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - req2ado_chroma:/chroma/chroma

  mcp-ado-server:
    build: ./mcp-ado-server
    env_file: .env
    environment:
      PORT: 4100
      # Re-added 2026-08-13: back on the Cato Networks TLS-inspecting proxy
      # network -- dev.azure.com's real leaf cert now chains through a
      # rotated Cato intermediate (Cato-Networks-Server-tlvcatod8a, valid to
      # 2027-07-09) that the container's default trust store never sees on
      # its own. .certs/cato-ca-bundle.pem was refreshed from the live
      # handshake (the old bundle's intermediate had expired 2025-10-29).
      # buildHttpClient (realAdo.ts) trusts ONLY this exact CA when set --
      # remove again if this stops being the deployment network.
    volumes:
      - ./.certs:/app/.certs:ro
    ports:
      - "4100:4100"

  ingestion:
    build: ./ingestion
    # env_file loads .env, which now also carries SHAREPOINT_TOKEN /
    # GRAPH_TOKEN (Microsoft Graph bearer for KB doc ingest via
    # POST /kb/ingest-url). Absent token → ingestion still boots; the ingest
    # route just 400s until one is set. See .env.template.
    env_file: .env
    environment:
      PORT: 8000
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      REDIS_URL: redis://redis:6379
    <<: *app-logging
    ports:
      # Host port 8000 is taken by an unrelated container on dev machines
      # (see scripts/run-golden-e2e.sh) — map to 8010 instead, matching the
      # local-process golden E2E script's port for consistency.
      - "8010:8000"
    depends_on:
      - chroma
      - redis

  # Runs Prisma migrations once, then exits -- previously baked into
  # orchestrator's own Dockerfile CMD as `sh -c "npx prisma migrate deploy
  # && node dist/main.js"`, which raced under multiple orchestrator replicas
  # (or even a single rolling update) and, as a shell-form CMD, also meant
  # PID 1 was `sh`, not `node` -- SIGTERM sent to the container was never
  # reliably forwarded to the actual Node process, breaking graceful
  # shutdown. Mirrors the k8s initContainer pattern this maps onto (see
  # k8s manifests).
  migrate:
    build:
      # Root context, not ./orchestrator — the Dockerfile also needs the
      # root docs/ folder (WikiController reads it at runtime).
      context: .
      dockerfile: orchestrator/Dockerfile
      # The `prisma` CLI package is a devDependency, stripped from the
      # slim multi-stage `runtime` target (see orchestrator/Dockerfile) --
      # `builder` still has the full node_modules `npx prisma` needs.
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      - postgres

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file: .env
    environment:
      PORT: 3001
      MCP_URL: http://mcp-ado-server:4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
      INGESTION_BASE_URL: http://ingestion:8000
      # Frontend is served on its own origin/port (4082) below, not
      # same-origin behind a reverse proxy — CORS must be enabled for it.
      CORS_ORIGIN: http://localhost:4082
      # Re-added 2026-08-13, same reasoning as mcp-ado-server above -- back
      # on the Cato-intercepting network, and the bundle is now current
      # (see .certs/cato-ca-bundle.pem). NODE_EXTRA_CA_CERTS is additive to
      # Node's default trust store (unlike mcp-ado-server's ADO_CA_CERT),
      # so this stays harmless if the container ever runs off that network.
      NODE_EXTRA_CA_CERTS: /app/.certs/cato-ca-bundle.pem
    command: ["node", "dist/main.js"]
    <<: *app-logging
    volumes:
      - ./.certs:/app/.certs:ro
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mcp-ado-server:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  pipeline-worker:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file: .env
    environment:
      MCP_URL: http://mcp-ado-server:4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
      INGESTION_BASE_URL: http://ingestion:8000
      # Same reasoning as orchestrator above -- pipeline-worker makes real
      # ADO write calls on job confirm and needs the same trust.
      NODE_EXTRA_CA_CERTS: /app/.certs/cato-ca-bundle.pem
    command: ["node", "dist/modules/pipeline/pipeline-worker.main.js"]
    <<: *app-logging
    volumes:
      - ./.certs:/app/.certs:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mcp-ado-server:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      # nginx (frontend/nginx.conf.template) proxies /api/ to this upstream
      # by in-network service DNS name -- the browser only ever talks to
      # this container's own origin (localhost:4082), never orchestrator's
      # published port directly, so CORS is no longer needed either.
      UPSTREAM_HOST: orchestrator
      UPSTREAM_PORT: 3001
    ports:
      # Host 4080/4081 are occupied by unrelated containers on this dev
      # machine — map to a free host port instead.
      - "4082:80"
    depends_on:
      - orchestrator

volumes:
  req2ado_pg:
  req2ado_chroma:
