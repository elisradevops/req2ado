services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: req2ado
      POSTGRES_PASSWORD: req2ado
      POSTGRES_DB: req2ado
    ports:
      # Host 5432 is occupied by a leftover container from a prior
      # local-process golden-e2e run on this dev machine (see
      # scripts/run-golden-e2e.sh's temp postgres container) — map to a free
      # host port instead. Internal service-to-service traffic is unaffected
      # (DATABASE_URL below uses the compose-internal `postgres:5432`).
      - "5434:5432"
    volumes:
      - req2ado_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Same reasoning as postgres above — host 6379 is occupied by a
      # leftover temp container; REDIS_URL below uses `redis:6379` internally.
      - "6381:6379"

  # Phase 1+ — not built in Phase 0
  # chroma:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - req2ado_chroma:/chroma/chroma

  mcp-ado-server:
    build: ./mcp-ado-server
    env_file: .env
    environment:
      PORT: 4100
      # Only used when ADO_BACKEND=real (currently mock) — RealAdoBackend
      # trusts this CA bundle for on-prem TLS, per its own caCertPath config
      # (a separate mechanism from NODE_EXTRA_CA_CERTS, see orchestrator's
      # comment on the same cert). Mounted proactively so flipping to
      # ADO_BACKEND=real doesn't also require a compose change.
      ADO_CA_CERT: /certs/cato-ca-bundle.pem
    volumes:
      - ./.certs/cato-ca-bundle.pem:/certs/cato-ca-bundle.pem:ro
    ports:
      - "4100:4100"

  ingestion:
    build: ./ingestion
    # env_file loads .env, which now also carries SHAREPOINT_TOKEN /
    # GRAPH_TOKEN (Microsoft Graph bearer for KB doc ingest via
    # POST /kb/ingest-url). Absent token → ingestion still boots; the ingest
    # route just 400s until one is set. See .env.template.
    env_file: .env
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379
    ports:
      # Host port 8000 is taken by an unrelated container on dev machines
      # (see scripts/run-golden-e2e.sh) — map to 8010 instead, matching the
      # local-process golden E2E script's port for consistency.
      - "8010:8000"
    volumes:
      # Chroma's PersistentClient (dedup vectors + P2a's KB chunks) writes
      # to settings.chroma_persist_path ("./.req2ado/vectors", resolved
      # against the Dockerfile's WORKDIR /app) — without a volume this
      # resets on every `docker compose up --build`. Reuses the
      # already-declared (previously unused) req2ado_chroma volume rather
      # than adding a new one.
      - req2ado_chroma:/app/.req2ado/vectors
    depends_on:
      - redis

  orchestrator:
    build:
      # Root context, not ./orchestrator — the Dockerfile also needs the
      # root docs/ folder (WikiController reads it at runtime).
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file: .env
    environment:
      PORT: 3001
      MCP_URL: http://mcp-ado-server:4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
      INGESTION_BASE_URL: http://ingestion:8000
      # Frontend is served on its own origin/port (4082) below, not
      # same-origin behind a reverse proxy — CORS must be enabled for it.
      CORS_ORIGIN: http://localhost:4082
      # Corporate network runs outbound HTTPS through a Cato Networks
      # TLS-inspecting proxy (confirmed by inspecting the real cert's issuer:
      # CN=Cato-Networks-Server-tlvcatod4). The host trusts it because Cato's
      # client installs its root CA into macOS's system keychain — containers
      # never see that CA on their own, so any outbound HTTPS call (e.g. the
      # login route's connectionData check) fails cert verification with
      # "fetch failed" unless this CA bundle is trusted here too.
      NODE_EXTRA_CA_CERTS: /certs/cato-ca-bundle.pem
    volumes:
      - ./.certs/cato-ca-bundle.pem:/certs/cato-ca-bundle.pem:ro
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - mcp-ado-server

  pipeline-worker:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file: .env
    environment:
      MCP_URL: http://mcp-ado-server:4100
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
      INGESTION_BASE_URL: http://ingestion:8000
    command: ["node", "dist/modules/pipeline/pipeline-worker.main.js"]
    depends_on:
      - postgres
      - redis
      - mcp-ado-server

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this in at build time — the browser (running on the
        # host, not inside the compose network) reaches the orchestrator via
        # its published host port, not the internal service DNS name.
        # Note: the frontend now reads its API base URL from the runtime-
        # fetched /config.json (frontend/public/config.json) at startup;
        # this build arg is kept as a compose-file fallback artifact only.
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      # Host 4080/4081 are occupied by unrelated containers on this dev
      # machine — map to a free host port instead.
      - "4082:80"
    depends_on:
      - orchestrator

volumes:
  req2ado_pg:
  req2ado_chroma:
