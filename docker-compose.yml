version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: req2ado
      POSTGRES_PASSWORD: req2ado
      POSTGRES_DB: req2ado
    ports:
      - "5432:5432"
    volumes:
      - req2ado_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Phase 1+ — not built in Phase 0
  # chroma:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - req2ado_chroma:/chroma/chroma

  mcp-ado-server:
    build: ./mcp-ado-server
    env_file: .env
    environment:
      PORT: 4100
    ports:
      - "4100:4100"

  # Phase 1+ — not built in Phase 0
  # ingestion:
  #   build: ./ingestion
  #   env_file: .env
  #   environment:
  #     PORT: 8000
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - chroma

  orchestrator:
    build: ./orchestrator
    env_file: .env
    environment:
      PORT: 3001
      MCP_URL: http://mcp-ado-server:4100
      INGESTION_URL: http://ingestion:8000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://req2ado:req2ado@postgres:5432/req2ado
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - mcp-ado-server

  # Phase 1+ — not built in Phase 0
  # frontend:
  #   build: ./frontend
  #   environment:
  #     API_BASE_URL: http://orchestrator:3001
  #   ports:
  #     - "4080:80"
  #   depends_on:
  #     - orchestrator

volumes:
  req2ado_pg:
  req2ado_chroma:
