name: '🚀 publish - req2ado-mcp-ado-server'
on:
  push:
    branches:
      - main
    paths:
      - 'mcp-ado-server/**'
      - '.github/workflows/mcp-ado-server-release.yml'

# See frontend-release.yml's own comment -- shared literal group name across
# all four *-release.yml workflows so their version-bump commits/pushes to
# main queue instead of racing.
concurrency:
  group: req2ado-release-version-bump
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: mcp-ado-server
        with:
          commit-message: 'CI: bumps mcp-ado-server version to {{version}} [skip ci]'
          tag-prefix: 'mcp-ado-server-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: mcp-ado-server
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-ado-server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-mcp-ado-server:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-mcp-ado-server:latest
