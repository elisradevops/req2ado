name: '🚀 publish - req2ado-mcp-ado-server'
on:
  push:
    branches:
      - main
    paths:
      - 'mcp-ado-server/**'
  # See orchestrator-release.yml's own comment: manual re-trigger from the
  # live branch tip, correctly retries a lost version-bump-push race
  # (gh run rerun does not -- it replays against the original, now-stale
  # trigger commit).
  workflow_dispatch:

# See frontend-release.yml's own comment for the full story: no trigger on
# this file's own edits, and a race-on-simultaneous-multi-package-commit
# limitation (a shared concurrency group was tried and reverted -- it
# cancelled real publishes instead of queueing them).

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: mcp-ado-server
        with:
          commit-message: 'CI: bumps mcp-ado-server version to {{version}} [skip ci]'
          tag-prefix: 'mcp-ado-server-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: mcp-ado-server
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-ado-server
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-mcp-ado-server:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-mcp-ado-server:latest
