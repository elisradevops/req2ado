name: CI

# No test workflow existed anywhere in this repo before this file -- every
# jest/vitest/pytest suite in this codebase (frontend/orchestrator/
# mcp-ado-server/ingestion) only ever ran locally, on whoever remembered to.
# This is what gives the hex-color ratchet test (src/design/palette.test.ts)
# and every other test in the repo somewhere to actually enforce anything
# for a second contributor's PR, not just the person who happens to run
# `pnpm test` by hand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (frontend / orchestrator / mcp-ado-server)
    runs-on: ubuntu-latest
    # Safety net, not a fix: this job hung twice today (once from a real
    # leaked setInterval, since fixed; once with no code-level cause found
    # after real effort -- isolated orchestrator, full local `pnpm test`,
    # and the exact CI command all ran clean in under a minute, repeatedly).
    # A normal run takes ~2 min. 20 min gives real headroom while turning
    # any future hang into a fast, visible failure instead of burning
    # unbounded CI time and needing a manual `gh run cancel`.
    timeout-minutes: 20
    # orchestrator/test/health.e2e-spec.ts boots the full AppModule, which
    # eagerly constructs real (non-lazyConnect) ioredis clients for
    # JobEventsPublisher/JobEventsController/JobEventPersistenceService --
    # same image docker-compose.yml's own redis service uses. Postgres is
    # NOT needed here: PrismaClient connects lazily on first query, and
    # nothing in this job's test suites (including that e2e spec, which only
    # hits the dependency-free GET /health liveness check, not /ready)
    # actually queries it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  ingestion:
    name: Ingestion (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # ingestion/Dockerfile installs these for the same reason: real,
      # non-mocked OCR/PDF tests call the actual pdfinfo/pdftoppm (poppler)
      # and tesseract CLIs, not fakes -- confirmed live (missing entirely on
      # a stock hosted runner, 9 failures, all tracing back to
      # PDFInfoNotInstalledError/TesseractError). tesseract-ocr-heb
      # specifically for the one real (non-mocked) Hebrew OCR test --
      # Debian's tesseract-ocr package ships eng+osd only.
      - name: Install OCR/PDF system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-heb
      - run: pip install -e ".[dev]"
      - run: pytest

  # Advisory (continue-on-error) for now: this is the FIRST real-model-output
  # regression signal in this repo -- every jest/pytest suite above mocks the
  # LLM client. Only the BASELINE subset (jobs #1/#2 of
  # scripts/run-golden-e2e.sh) is wired here -- it needs no Ollama/LLM
  # backend at all (see the script's --baseline-only comment), so it's
  # viable on a stock hosted runner. The SURVEY/dedup subset (jobs #3/#4)
  # runs on .github/workflows/nightly-survey-e2e.yml instead (needs a real
  # local Ollama with real models pulled -- not viable on a stock hosted
  # runner). Flip this job to blocking (remove continue-on-error) only after
  # two CONSECUTIVE green runs of that nightly workflow have been observed
  # (see req2ado's reliability roadmap, S8) -- that is a real-world
  # observation over time, not something to infer from the code.
  #
  # The duplicate-Prisma-migration blocker that used to be flagged here
  # (20260709093128_add_job_state_iteration vs.
  # 20260720130000_add_job_state_iteration, both from the same reconcile
  # merge commit) is fixed -- the later-timestamped duplicates were deleted
  # from orchestrator/prisma/migrations.
  golden-e2e-baseline:
    name: Golden E2E (BASELINE subset, mock ADO)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up ingestion venv
        working-directory: ingestion
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - run: bash scripts/run-golden-e2e.sh --baseline-only
      # The script's own service logs (orchestrator/pipeline-worker/ingestion)
      # only ever live at a mktemp'd /tmp path on the ephemeral runner -- gone
      # the moment the job ends, so a failure here previously left NO detail
      # more specific than "FAILED. Logs preserved at: <path>" in the CI
      # console. Confirmed live: root-causing one real failure required a
      # full local repro since the actual error (a missing required field in
      # the script's own job-submit call) was only ever in that lost log.
      - name: Upload golden-e2e service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-e2e-logs
          path: /tmp/req2ado-e2e-logs.*/*
          if-no-files-found: ignore
          retention-days: 7
