name: '🚀 publish - req2ado-valkey'
on:
  push:
    branches:
      - main
    paths:
      - 'valkey-initializer/**'
jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ wait for CI
        # Publish previously had NO dependency on CI -- both triggered
        # independently off the same push event, so publish could finish
        # (and push a new image tag) before CI even reported status, or
        # after CI had already failed outright. Blocks here until the CI
        # workflow run for THIS exact commit (github.sha -- the commit
        # that triggered this push) reports a completed, successful
        # conclusion. Any other outcome aborts the publish before
        # checkout/build/push ever run. Applies to workflow_dispatch too
        # (not just push) -- a manual retry should still refuse to publish
        # on top of a commit CI never actually passed.
        env:
          GH_TOKEN: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          # Walk back past [skip ci] version-bump commits (this repo's own
          # convention -- every automated bump commit, e.g. "CI: bumps
          # orchestrator version to X [skip ci]", only touches package.json/
          # package-lock.json, never application code) before checking CI.
          # Confirmed real gap: GitHub suppresses ALL push-triggered
          # workflows, CI included, for any commit whose message contains
          # [skip ci] -- such a commit NEVER gets a CI run at all. A
          # workflow_dispatch's ref resolves to the branch's CURRENT tip at
          # dispatch time, which can legitimately BE one of these bump
          # commits (confirmed live) -- without this walk-back, this step
          # would poll forever for a CI run that can never exist and time
          # out, blocking a publish whose actual code already passed CI on
          # the parent commit.
          for i in $(seq 1 10); do
            # Written to a file, not a shell variable -- a raw commit object
            # (unlike the pre-filtered actions/runs lookup below) can carry
            # content (e.g. a GPG signature block) that corrupts when
            # round-tripped through `echo "$VAR" | jq` (confirmed live).
            gh api "repos/${{ github.repository }}/commits/$SHA" > /tmp/commit.json
            COMMIT_MSG=$(jq -r '.commit.message' /tmp/commit.json)
            if echo "$COMMIT_MSG" | grep -qiE '\[skip ci\]|\[ci skip\]'; then
              PARENT_SHA=$(jq -r '.parents[0].sha' /tmp/commit.json)
              echo "$SHA is a [skip ci] commit ('$COMMIT_MSG') -- walking back to parent $PARENT_SHA"
              SHA="$PARENT_SHA"
              continue
            fi
            break
          done
          echo "Waiting for the 'CI' workflow to complete on $SHA..."
          for i in $(seq 1 40); do
            RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" --jq '[.workflow_runs[] | select(.name=="CI")][0]')
            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "No CI run found yet for $SHA -- waiting..."
              sleep 15
              continue
            fi
            RUN_STATUS=$(echo "$RUN_JSON" | jq -r '.status')
            if [ "$RUN_STATUS" != "completed" ]; then
              echo "CI run status: $RUN_STATUS -- waiting..."
              sleep 15
              continue
            fi
            RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
            echo "CI run completed with conclusion: $RUN_CONCLUSION"
            if [ "$RUN_CONCLUSION" = "success" ]; then
              exit 0
            fi
            echo "CI did not succeed for $SHA (conclusion: $RUN_CONCLUSION) -- aborting publish."
            exit 1
          done
          echo "Timed out waiting for CI to complete for $SHA."
          exit 1
      - name: 📚 checkout
        uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read version
        run: echo "version=$(cat valkey-initializer/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
        id: docker-id
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: elisradevops/req2ado-valkey

          tags: |
            ${{ steps.docker-id.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./valkey-initializer/
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            elisradevops/req2ado-valkey:latest
