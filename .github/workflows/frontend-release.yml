name: '🚀 publish - req2ado-frontend'
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  # See orchestrator-release.yml's own comment: manual re-trigger from the
  # live branch tip, correctly retries a lost version-bump-push race
  # (gh run rerun does not -- it replays against the original, now-stale
  # trigger commit).
  workflow_dispatch:

# No trigger on '.github/workflows/frontend-release.yml' itself (unlike the
# docgen precedent's blanket paths-ignore: '.github/**', scoped here to just
# this file since paths:/paths-ignore: can't mix on one trigger) -- editing
# CI config alone shouldn't force a version bump + republish. This also
# stops a real, confirmed failure mode: adding/editing multiple of these
# four *-release.yml files in ONE commit previously fired all of them
# simultaneously, and their version-bump steps raced pushing to main (one
# "! [rejected] main -> main (fetch first)"). A shared `concurrency:` group
# was tried as a fix and reverted -- GitHub Actions only keeps the LAST
# queued run per group and CANCELS earlier-queued ones outright, which
# silently dropped two real publishes instead of racing harmlessly. A
# future push touching 2+ of frontend/orchestrator/mcp-ado-server/ingestion
# at once can still race the same way; no image is pushed before the
# version-bump step succeeds, so a lost race just fails that run cleanly --
# re-run it by hand (`gh run rerun <id>`) if it happens.

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: frontend
        with:
          commit-message: 'CI: bumps frontend version to {{version}} [skip ci]'
          tag-prefix: 'frontend-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: frontend
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-frontend:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-frontend:latest
