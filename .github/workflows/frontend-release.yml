name: '🚀 publish - req2ado-frontend'
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  # See orchestrator-release.yml's own comment: manual re-trigger from the
  # live branch tip, correctly retries a lost version-bump-push race
  # (gh run rerun does not -- it replays against the original, now-stale
  # trigger commit).
  workflow_dispatch:

# No trigger on '.github/workflows/frontend-release.yml' itself -- editing
# CI config alone shouldn't force a version bump + republish.
#
# Concurrency strategy: `cancel-in-progress: false` queues a second publish
# run (e.g. orchestrator + frontend both triggered by one commit) rather than
# cancelling it. The checkout below uses `ref: github.ref_name` (the live
# branch tip) so the queued run always starts from the state AFTER the first
# run's version-bump commit, never from the stale trigger SHA. Together these
# two changes eliminate the "fetch first" rejection without losing any publish.
# Three or more simultaneous triggers (touching 3+ packages in one commit)
# would still lose the middle runs to GitHub's "only one pending per group"
# limit, but that case is rare and fixable by re-running the cancelled jobs.

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ wait for CI
        # Publish previously had NO dependency on CI -- both triggered
        # independently off the same push event, so publish could finish
        # (and push a new image tag) before CI even reported status, or
        # after CI had already failed outright. Blocks here until the CI
        # workflow run for THIS exact commit (github.sha -- the commit
        # that triggered this push) reports a completed, successful
        # conclusion. Any other outcome aborts the publish before
        # checkout/build/push ever run. Applies to workflow_dispatch too
        # (not just push) -- a manual retry should still refuse to publish
        # on top of a commit CI never actually passed.
        env:
          GH_TOKEN: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting for the 'CI' workflow to complete on $SHA..."
          for i in $(seq 1 40); do
            RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" --jq '[.workflow_runs[] | select(.name=="CI")][0]')
            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "No CI run found yet for $SHA -- waiting..."
              sleep 15
              continue
            fi
            RUN_STATUS=$(echo "$RUN_JSON" | jq -r '.status')
            if [ "$RUN_STATUS" != "completed" ]; then
              echo "CI run status: $RUN_STATUS -- waiting..."
              sleep 15
              continue
            fi
            RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
            echo "CI run completed with conclusion: $RUN_CONCLUSION"
            if [ "$RUN_CONCLUSION" = "success" ]; then
              exit 0
            fi
            echo "CI did not succeed for $SHA (conclusion: $RUN_CONCLUSION) -- aborting publish."
            exit 1
          done
          echo "Timed out waiting for CI to complete for $SHA."
          exit 1
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
          ref: ${{ github.ref_name }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: frontend
        with:
          commit-message: 'CI: bumps frontend version to {{version}} [skip ci]'
          tag-prefix: 'frontend-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: frontend
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-frontend:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-frontend:latest
