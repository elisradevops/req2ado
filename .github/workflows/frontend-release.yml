name: '🚀 publish - req2ado-frontend'
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-release.yml'

# Shared literal group name across all four *-release.yml workflows (GitHub
# Actions matches concurrency groups by name across an entire repo, not
# per-workflow-file) -- each one's version-bump step commits+pushes to the
# same main branch via the same PAT, so two firing at once race for that
# push (confirmed live: all four fired together on the commit that first
# added them, and three lost the race with "! [rejected] main -> main
# (fetch first)"). queued, not cancelled -- a cancelled run could abort
# mid Docker push.
concurrency:
  group: req2ado-release-version-bump
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: frontend
        with:
          commit-message: 'CI: bumps frontend version to {{version}} [skip ci]'
          tag-prefix: 'frontend-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: frontend
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-frontend:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-frontend:latest
