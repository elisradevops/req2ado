name: '🚀 publish - req2ado-frontend'
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  # See orchestrator-release.yml's own comment: manual re-trigger from the
  # live branch tip, correctly retries a lost version-bump-push race
  # (gh run rerun does not -- it replays against the original, now-stale
  # trigger commit).
  workflow_dispatch:

# No trigger on '.github/workflows/frontend-release.yml' itself -- editing
# CI config alone shouldn't force a version bump + republish.
#
# Concurrency strategy: `cancel-in-progress: false` queues a second publish
# run (e.g. orchestrator + frontend both triggered by one commit) rather than
# cancelling it. The checkout below uses `ref: github.ref_name` (the live
# branch tip) so the queued run always starts from the state AFTER the first
# run's version-bump commit, never from the stale trigger SHA. Together these
# two changes eliminate the "fetch first" rejection without losing any publish.
# Three or more simultaneous triggers (touching 3+ packages in one commit)
# would still lose the middle runs to GitHub's "only one pending per group"
# limit, but that case is rare and fixable by re-running the cancelled jobs.

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
          ref: ${{ github.ref_name }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: frontend
        with:
          commit-message: 'CI: bumps frontend version to {{version}} [skip ci]'
          tag-prefix: 'frontend-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: frontend
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-frontend:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-frontend:latest
