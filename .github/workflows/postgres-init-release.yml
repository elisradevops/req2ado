name: '🚀 publish - req2ado-postgres'
on:
  push:
    branches:
      - main
    paths:
      - 'postgres-initializer/**'
jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read version
        run: echo "version=$(cat postgres-initializer/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
        id: docker-id
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: elisradevops/req2ado-postgres

          tags: |
            ${{ steps.docker-id.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./postgres-initializer/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            elisradevops/req2ado-postgres:latest
