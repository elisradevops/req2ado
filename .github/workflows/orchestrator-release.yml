name: '🚀 publish - req2ado-orchestrator'
on:
  push:
    branches:
      - main
    paths:
      - 'orchestrator/**'
  # Lets a publish be re-triggered by hand (Actions tab "Run workflow", or
  # `gh workflow run`) without a code change -- also the correct way to
  # retry a run that lost the version-bump-push race (confirmed live:
  # `gh run rerun` replays against the ORIGINAL trigger commit, not main's
  # current tip, so it just loses the race again against real progress
  # since made; workflow_dispatch always runs against the live branch tip).
  workflow_dispatch:

# See frontend-release.yml's own comment for the full story on the concurrency
# + ref: github.ref_name strategy that eliminates the version-bump-push race.

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ wait for CI
        # Publish previously had NO dependency on CI -- both triggered
        # independently off the same push event, so publish could finish
        # (and push a new image tag) before CI even reported status, or
        # after CI had already failed outright. Blocks here until the CI
        # workflow run for THIS exact commit (github.sha -- the commit
        # that triggered this push) reports a completed, successful
        # conclusion. Any other outcome aborts the publish before
        # checkout/build/push ever run. Applies to workflow_dispatch too
        # (not just push) -- a manual retry should still refuse to publish
        # on top of a commit CI never actually passed.
        env:
          GH_TOKEN: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting for the 'CI' workflow to complete on $SHA..."
          for i in $(seq 1 40); do
            RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" --jq '[.workflow_runs[] | select(.name=="CI")][0]')
            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "No CI run found yet for $SHA -- waiting..."
              sleep 15
              continue
            fi
            RUN_STATUS=$(echo "$RUN_JSON" | jq -r '.status')
            if [ "$RUN_STATUS" != "completed" ]; then
              echo "CI run status: $RUN_STATUS -- waiting..."
              sleep 15
              continue
            fi
            RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
            echo "CI run completed with conclusion: $RUN_CONCLUSION"
            if [ "$RUN_CONCLUSION" = "success" ]; then
              exit 0
            fi
            echo "CI did not succeed for $SHA (conclusion: $RUN_CONCLUSION) -- aborting publish."
            exit 1
          done
          echo "Timed out waiting for CI to complete for $SHA."
          exit 1
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
          ref: ${{ github.ref_name }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: orchestrator
        with:
          commit-message: 'CI: bumps orchestrator version to {{version}} [skip ci]'
          tag-prefix: 'orchestrator-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: orchestrator
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./orchestrator -- orchestrator/Dockerfile also
          # COPYs the root docs/ folder (WikiController reads it at runtime).
          # See that Dockerfile's own doc comment; docker-compose.yml builds
          # it the same way.
          context: .
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-orchestrator:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-orchestrator:latest
      # Second build of the SAME Dockerfile and the SAME context, stopping at
      # the `builder` stage instead of running through to `runtime`.
      # k8s/20-migrate-job.yaml runs `npx prisma migrate deploy` against this
      # image: the `prisma` CLI is a devDependency, so `runtime`'s
      # `npm ci --omit=dev` strips it out entirely -- that stage COPYs the
      # prisma/ schema in but has no CLI to apply it with. Mirrors
      # docker-compose.yml's `migrate` service, which sets `target: builder`
      # for exactly this reason. Before this step existed, NO builder-stage
      # tag was ever published and the migrate Job could not pull at all.
      - name: Build and push (builder stage, for the migrate Job)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator/Dockerfile
          target: builder
          # amd64 only, deliberately -- unlike the runtime image above, this
          # one only ever runs as a short-lived k8s migrate Job on this
          # deployment's own (amd64) cluster nodes, never distributed
          # standalone. Also sidesteps a real, reproduced problem: building
          # this stage's full npm install under linux/arm64 QEMU emulation
          # crashed with "qemu: uncaught target signal 4 (Illegal
          # instruction) - core dumped" during `npm ci` -- a QEMU/native-
          # addon incompatibility, not a bug in this Dockerfile. Revisit if
          # this image ever needs to run on an arm64 node.
          platforms: linux/amd64
          push: true
          # Same reason as the runtime build above: the default OCI build
          # attestations do not pull through this org's Artifactory Docker
          # remote-repo config.
          provenance: false
          sbom: false
          # cache-from only, deliberately no cache-to. `builder` is a PARENT
          # stage of `runtime`, and the step above exports mode=max (every
          # intermediate stage), so this exact stage's layers are already in
          # the cache under the same default scope. Re-exporting them would
          # collide on an immutable GHA cache key -- a 409 surfaced as a noisy
          # "failed to save cache" warning -- for zero added coverage.
          cache-from: type=gha
          # `latest-builder` is the tag k8s/20-migrate-job.yaml tracks, exactly
          # as its four sibling manifests track `:latest`. Nothing in CI ever
          # rewrites k8s/, so a version-pinned-only tag there would silently
          # rot on the next orchestrator release.
          tags: |
            elisradevops/req2ado-orchestrator:${{ steps.package-version.outputs.current-version }}-builder
            elisradevops/req2ado-orchestrator:latest-builder
