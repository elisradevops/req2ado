name: '🚀 publish - req2ado-orchestrator'
on:
  push:
    branches:
      - main
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-release.yml'

# See frontend-release.yml's own comment -- shared literal group name across
# all four *-release.yml workflows so their version-bump commits/pushes to
# main queue instead of racing.
concurrency:
  group: req2ado-release-version-bump
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 publish
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ELISRADEVOPS_ACCESS_TOKEN }}
      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 'Automated Version Bump'
        uses: 'phips28/gh-action-bump-version@master'
        id: bump_version
        env:
          PACKAGEJSON_DIR: orchestrator
        with:
          commit-message: 'CI: bumps orchestrator version to {{version}} [skip ci]'
          tag-prefix: 'orchestrator-v'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@master
        with:
          path: orchestrator
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./orchestrator -- orchestrator/Dockerfile also
          # COPYs the root docs/ folder (WikiController reads it at runtime).
          # See that Dockerfile's own doc comment; docker-compose.yml builds
          # it the same way.
          context: .
          file: orchestrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            elisradevops/req2ado-orchestrator:${{ steps.package-version.outputs.current-version }}
            elisradevops/req2ado-orchestrator:latest
