# req2ado default configuration. No secrets — those come from .env / environment.
mode: baseline # baseline | survey

llm:
  provider: openai_compatible
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  chat_model: ${LLM_CHAT_MODEL}
  embed_model: ${LLM_EMBED_MODEL}
  embed_transport: ollama # ollama | openai — Open WebUI does not expose an OpenAI-shaped /embeddings endpoint; it only proxies Ollama-shaped /ollama/api/embed. Default to 'ollama' until/unless a real OpenAI-shaped embeddings backend is configured separately.
  embed_base_url: ${EMBED_BASE_URL} # optional override; defaults to llm.base_url (Open WebUI) if unset
  vision_model: ${LLM_VISION_MODEL}
  temperature: 0
  trusted_local: false # true => relax pre-egress redaction guard
  enabled_in_baseline: false # LLM stays off in baseline unless explicitly enabled (extraction only)

ado:
  base_url: ${ADO_BASE_URL}
  project: ${ADO_PROJECT}
  area_path: ${ADO_AREA_PATH}
  api_version: "7.1" # ladder: 7.1 -> 5.1 -> none
  ca_cert_path: ${ADO_CA_CERT} # on-prem self-signed CA trust
  bypass_rules: false
  batch_size: 200
  concurrency: 8
  dry_run: true # always default to safe
  backend: mock # real | mock — Phase 0 default; switch to real once ADO_BACKEND=real + on-prem creds are configured (Phase 7)

mcp:
  url: ${MCP_URL}
  bearer: ${MCP_BEARER}

fields:
  title: System.Title
  description: System.Description
  state: System.State
  state_value: Proposed
  area_path: System.AreaPath
  customer_id: null # unset = auto-resolve via candidate list (Custom.CustomerId, Custom.CustomerRequirementId, Custom.CustomerID), verified at runtime via ado_discover_fields; set explicitly to override
  requirement_type: Microsoft.VSTS.CMMI.RequirementType
  parent_link: System.LinkTypes.Hierarchy-Reverse

leveling:
  profile: auto # auto | tv_style | icd_style | custom
  auto_baseline_strategy: heuristic # heuristic (deterministic) | llm (opt-in)

dedup:
  store: chroma
  path: ./.req2ado/vectors
  threshold: 0.90
  scope_by_area_path: true

queue:
  redis_url: ${REDIS_URL}
  concurrency: 4

db:
  url: ${DATABASE_URL}

redaction:
  patterns: [part_number, hostname, url, email, guid]

audit:
  log_path: ./.req2ado/audit.jsonl

auth:
  provider: ado_pat # ado_pat | azure_ad — ado_pat validates the PAT against the ADO Server itself (no external IdP needed); azure_ad requires an App Registration, kept as a future option
  roles: [admin, operator, viewer] # RBAC machinery exists but is unused today — every ado_pat login gets 'operator'; ADO's own permissions are the real gate
